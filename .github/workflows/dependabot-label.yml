# Step 1 of 2: mark Dependabot PRs that are safe to merge on their own (patch only).
name: Dependabot label
on: pull_request
permissions:
  pull-requests: write
jobs:
  label:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh label create automerge-ok --color 0E8A16 --description "Dependabot patch, merges after a green Vercel preview" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh pr edit "$PR_URL" --add-label automerge-ok
