# Keeps Next.js, React and the rest of npm current. Security updates are separate
# (repo setting "Dependabot security updates") and also flow through auto-merge below.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "sharp"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
